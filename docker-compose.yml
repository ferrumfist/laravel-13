version: '3.5'
services:
  db:
    image: mysql:5.7.27
    restart: on-failure
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --sql-mode=""
    volumes:
        - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 654321
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: 123456
    ports:
      - $DB_PORT:3306

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - $PHPMYADMIN_PORT:80
    depends_on:
      - db
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=654321

volumes:
    mysql-data:
